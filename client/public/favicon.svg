<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景: ディープパープル → インディゴのグラデ -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <!-- 中央円: 白ベース -->
    <radialGradient id="centerCircle" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </radialGradient>
    <!-- ハイライト -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景（角丸正方形・iOS/Android両対応） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 円グラフ（4セグメント = 4資産クラスを表現） -->
  <g transform="translate(256 256)" filter="url(#shadow)">
    <!-- セグメント1: 全世界株式（45%・赤系） -->
    <path d="M 0 -160 A 160 160 0 0 1 138.56 80 L 0 0 Z" fill="#f87171"/>
    <!-- セグメント2: 先進国債券（25%・青系） -->
    <path d="M 138.56 80 A 160 160 0 0 1 -50.49 151.84 L 0 0 Z" fill="#60a5fa"/>
    <!-- セグメント3: REIT（15%・ピンク系） -->
    <path d="M -50.49 151.84 A 160 160 0 0 1 -152.17 -49.45 L 0 0 Z" fill="#f472b6"/>
    <!-- セグメント4: コモディティ（15%・黄系） -->
    <path d="M -152.17 -49.45 A 160 160 0 0 1 0 -160 L 0 0 Z" fill="#fbbf24"/>

    <!-- 中央の白い円 -->
    <circle r="78" fill="url(#centerCircle)"/>

    <!-- 中央の上昇トレンドアイコン -->
    <g stroke="#6d28d9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 上昇ライン -->
      <polyline points="-42,28 -14,-2 14,16 42,-30"/>
      <!-- 矢印の頭 -->
      <polyline points="22,-30 42,-30 42,-12"/>
    </g>
    <!-- ドット強調 -->
    <circle cx="-42" cy="28" r="6" fill="#6d28d9"/>
    <circle cx="-14" cy="-2" r="6" fill="#6d28d9"/>
    <circle cx="14" cy="16" r="6" fill="#6d28d9"/>
    <circle cx="42" cy="-30" r="7" fill="#fbbf24"/>
  </g>
</svg>
