<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Background (safe maskable zone = central 80%) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Ascending bar chart -->
  <g>
    <rect x="120" y="320" width="56" height="80"  rx="10" fill="url(#bar)" opacity="0.85"/>
    <rect x="200" y="260" width="56" height="140" rx="10" fill="url(#bar)" opacity="0.9"/>
    <rect x="280" y="200" width="56" height="200" rx="10" fill="url(#bar)" opacity="0.95"/>
    <rect x="360" y="140" width="56" height="260" rx="10" fill="url(#bar)"/>
  </g>
  <!-- Trend arrow -->
  <path d="M120 280 L200 220 L280 170 L360 110 L320 110 L360 110 L360 150"
        fill="none" stroke="#fde047" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="280" r="10" fill="#fde047"/>
  <circle cx="200" cy="220" r="10" fill="#fde047"/>
  <circle cx="280" cy="170" r="10" fill="#fde047"/>
  <circle cx="360" cy="110" r="14" fill="#fde047"/>
</svg>
